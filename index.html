<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>育成ノート</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --primary:#3B5AA6;
    --primary-dark:#2C4380;
    --bg:#F3F5FA;
    --card:#FFFFFF;
    --border:#E4E6EE;
    --text:#1E2233;
    --sub:#6B7280;
    --c-jitsumu:#1565C0;
    --c-kyouiku:#2E7D32;
    --c-kaizen:#6A1B9A;
    --c-trouble:#C62828;
    --c-followUp:#EF6C00;
    --c-oneOnOne:#00796B;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  #app{min-height:100vh;background:var(--bg);}
  .app-shell{display:block;}
  .main-col{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:32px;}
  .sidebar{display:none;}

  /* ===== デスクトップ(PC)幅レイアウト ===== */
  @media (min-width:900px){
    .app-shell{display:flex;min-height:100vh;}
    .sidebar{
      display:flex;flex-direction:column;width:230px;flex-shrink:0;
      background:linear-gradient(180deg, var(--primary), var(--primary-dark));
      color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;
    }
    .sidebar .brand{font-size:16px;font-weight:800;margin-bottom:26px;display:flex;align-items:center;gap:8px;}
    .sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;}
    .sidebar .nav-item{
      display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;cursor:pointer;
      font-size:13.5px;font-weight:600;color:rgba(255,255,255,.82);transition:background .15s;
    }
    .sidebar .nav-item:hover{background:rgba(255,255,255,.1);}
    .sidebar .nav-item.active{background:rgba(255,255,255,.18);color:#fff;}
    .sidebar .nav-item .nicon{font-size:16px;width:20px;text-align:center;}
    .sidebar .logout-item{font-size:12.5px;color:rgba(255,255,255,.7);cursor:pointer;padding:10px 12px;}
    .sidebar .logout-item:hover{color:#fff;}

    .main-col{max-width:none;flex:1;padding:0;background:var(--bg);}
    .appbar{border-radius:0;}
    .appbar .back, .appbar #navBack{display:none;} /* PCではサイドバーで遷移するため戻る矢印は不要 */
    .content{max-width:760px;margin:0 auto;padding:28px 32px;}

    /* 記録一覧: 一覧と詳細を左右に並べる */
    .history-split{display:flex;gap:20px;align-items:flex-start;}
    .history-split .list-pane{flex:0 0 380px;max-height:calc(100vh - 210px);overflow-y:auto;padding-right:4px;}
    .history-split .detail-pane{flex:1;position:sticky;top:150px;}
    .history-split .detail-pane .card{max-height:calc(100vh - 210px);overflow-y:auto;}

    .stat-grid{grid-template-columns:repeat(3,1fr);max-width:520px;}
    .quick-actions{max-width:520px;}
    .member-grid{grid-template-columns:repeat(4,1fr);}
  }

  @keyframes fadeSlideIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  @keyframes pulseRing{ 0%{box-shadow:0 0 0 0 rgba(59,90,166,.35);} 100%{box-shadow:0 0 0 12px rgba(59,90,166,0);} }
  .content{padding:16px; animation:fadeSlideIn .28s ease both;}
  .card{ animation:fadeSlideIn .3s ease both; }

  .appbar{
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff;
    padding:16px 16px;
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 10px rgba(44,67,128,.25);
  }
  .appbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;}
  .appbar .back{cursor:pointer;font-size:20px;color:#fff;margin-right:8px;user-select:none;opacity:.9;}
  .appbar-actions{display:flex;gap:4px;align-items:center;}
  .icon-btn{
    background:rgba(255,255,255,.14);border:none;cursor:pointer;font-size:16px;color:#fff;
    padding:8px 10px;border-radius:10px;transition:background .15s, transform .1s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.26);}
  .icon-btn:active{transform:scale(.92);}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    transition:box-shadow .2s, transform .15s;
  }
  .card.hoverable:hover{box-shadow:0 6px 20px rgba(30,34,51,.08); transform:translateY(-2px);}
  .menu-card{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .menu-icon{
    width:50px;height:50px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  }
  .menu-card h3{margin:0 0 2px 0;font-size:15px;}
  .menu-card p{margin:0;font-size:12.5px;color:var(--sub);}

  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  input[type=text],input[type=password],input[type=date],select,textarea{
    width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:12px;
    font-size:14px;background:#fff;font-family:inherit;margin-bottom:14px;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,90,166,.12);
  }
  textarea{resize:vertical;min-height:60px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;border:none;border-radius:12px;
    padding:13px 18px;font-size:14px;font-weight:700;cursor:pointer;width:100%;
    transition:transform .1s, box-shadow .15s; box-shadow:0 3px 10px rgba(59,90,166,.25);
  }
  .btn:hover{box-shadow:0 5px 16px rgba(59,90,166,.35);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;}
  .btn.danger{background:linear-gradient(135deg,#E53935,#B71C1C);}
  .btn.small{width:auto;padding:9px 16px;font-size:13px;}
  .hint{
    background:linear-gradient(135deg,#FFF8E1,#FFF3C4);border:1px solid #FFE082;border-radius:10px;
    padding:11px;font-size:12px;text-align:center;margin-bottom:16px;color:#6b5900;
  }
  .badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;
  }
  .tabs{display:flex;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:60px;z-index:9;}
  .tab{flex:1;text-align:center;padding:13px;font-size:14px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;transition:color .15s;}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
  .filter-row{display:flex;gap:8px;margin-bottom:10px;}
  .filter-row select{margin-bottom:0;}
  .search-box{position:relative;margin-bottom:10px;}
  .search-box input{padding-left:36px;margin-bottom:0;}
  .search-box .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;}

  .name-group h4{margin:0 0 2px 0;font-size:15px;display:flex;align-items:center;gap:6px;}
  .name-group .count{font-size:12px;color:var(--sub);font-weight:400;}
  .record-row{
    display:flex;align-items:flex-start;gap:8px;padding:11px 0;border-top:1px solid #f0f0f5;cursor:pointer;
    border-left:3px solid transparent; padding-left:8px; margin-left:-8px; transition:background .12s;
  }
  .record-row:hover{background:#fafbff;}
  .record-row:first-of-type{border-top:none;}
  .record-row .rmain{flex:1;min-width:0;}
  .record-row .rtitle{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  .record-row .rdesc{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .record-row .rdate{font-size:11px;color:var(--sub);margin-top:2px;}
  .followup-chip{font-size:10px;background:#eef1fb;color:var(--primary);padding:2px 8px;border-radius:10px;white-space:nowrap;font-weight:700;}
  .empty-state{text-align:center;padding:48px 20px;color:var(--sub);font-size:14px;}
  .empty-state .eicon{font-size:38px;margin-bottom:8px;}

  .member-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .member-tile{
    background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px 8px;
    text-align:center;cursor:pointer;transition:box-shadow .2s, transform .15s;
  }
  .member-tile:hover{box-shadow:0 6px 20px rgba(30,34,51,.08); transform:translateY(-2px);}
  .member-avatar{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:16px;}

  .field{margin-bottom:14px;}
  .field .flabel{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px;}
  .field .fvalue{font-size:14.5px;white-space:pre-wrap;}
  .score-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .score-row .slabel{width:64px;font-size:13px;font-weight:700;flex-shrink:0;}
  .chip-choice{
    padding:6px 13px;border-radius:16px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:#fff;
    transition:transform .1s, background .15s, color .15s, border-color .15s;
  }
  .chip-choice:hover{border-color:var(--primary);}
  .chip-choice.selected{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.05);}
  .followup-card{background:#fafbfe;border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:8px;font-size:13px;animation:fadeSlideIn .25s ease both;}
  .followup-card .fdate{font-size:11px;color:var(--sub);margin-top:4px;}
  .settings-list .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid #f0f0f5;cursor:pointer;}
  .settings-list .row:first-child{border-top:none;}
  .member-edit-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid #f0f0f5;}
  .member-edit-row:first-child{border-top:none;}
  .mini-btn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--sub);padding:4px 6px;transition:transform .1s;}
  .mini-btn:active{transform:scale(.85);}

  .fab{
    position:fixed;bottom:24px;left:50%;transform:translateX(calc(-240px + 24px));
    background:linear-gradient(135deg, var(--primary), var(--primary-dark));color:#fff;border:none;border-radius:26px;padding:14px 22px;
    font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(44,67,128,.35);
    display:flex;align-items:center;gap:8px;animation:pulseRing 2s infinite;
  }
  @media (max-width:520px){ .fab{transform:none;right:16px;left:auto;} }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,22,35,.5);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px; animation:fadeSlideIn .2s ease both;
  }
  .modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:360px;animation:popIn .2s ease both;}
  .modal h3{margin-top:0;font-size:16px;}
  .modal-actions{display:flex;gap:8px;margin-top:12px;}
  .modal-actions .btn{width:auto;flex:1;}
  .error-text{color:#C62828;font-size:12px;margin:-8px 0 12px;}
  .section-title{font-size:13px;font-weight:700;color:var(--sub);margin:22px 0 10px;display:flex;align-items:center;gap:6px;}
  .link-btn{background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer;font-weight:700;}

  /* ダッシュボード */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{
    background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center;
  }
  .stat-card .snum{font-size:22px;font-weight:800;color:var(--primary);line-height:1.1;}
  .stat-card .slabel2{font-size:11px;color:var(--sub);margin-top:4px;}
  .chart-wrap{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px;}
  .chart-wrap h4{margin:0 0 10px 0;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .chart-canvas-box{position:relative;height:200px;}
  .quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .quick-btn{
    background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;
    transition:box-shadow .2s, transform .15s;
  }
  .quick-btn:hover{box-shadow:0 6px 18px rgba(30,34,51,.08); transform:translateY(-2px);}
  .quick-btn .qicon{font-size:22px;margin-bottom:4px;}
  .quick-btn .qlabel{font-size:12.5px;font-weight:700;}
  .rank-table{width:100%;border-collapse:collapse;font-size:13px;}
  .rank-table th, .rank-table td{padding:8px 6px;text-align:left;border-bottom:1px solid #f0f0f5;}
  .rank-table th{color:var(--sub);font-weight:700;font-size:11.5px;}
  .rank-badge{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#eef1fb;color:var(--primary);
    align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-right:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  EmailAuthProvider, reauthenticateWithCredential, updatePassword
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, arrayUnion, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* =====================================================================
   Firebase 初期化
   ▼▼▼ 下記4点を自分の環境に合わせて設定してください ▼▼▼
   1. firebaseConfig: Firebaseコンソール → プロジェクトの設定 → 全般 → 
      「マイアプリ」のWebアプリ設定からコピーした値に書き換える
   2. FIXED_EMAIL: ログイン画面はパスワードのみなので、内部的にサインインに
      使う固定メールアドレス。Firebaseコンソール → Authentication → Users で
      このメールアドレスのユーザーを1件だけ事前に作成しておくこと
      (初期パスワードは何でもよく、アプリの設定画面から変更できます)
   3. Firestoreを有効化しておくこと(コンソール → Firestore Database → 作成)
   4. セキュリティルールを別途デプロイすること(firestore.rules を参照)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBQbrLEYOwdO3a0hubPCS8iDhzjeDySDuM",
  authDomain: "teisei-hyouka.firebaseapp.com",
  projectId: "teisei-hyouka",
  storageBucket: "teisei-hyouka.firebasestorage.app",
  messagingSenderId: "812375185341",
  appId: "1:812375185341:web:7f26ae362c0b595092a4d4"
};
const FIXED_EMAIL = 'kakari@packaging.internal';
/* ===================================================================== */

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ===================== 分類の初期値 ===================== */
function defaultCategories(){
  return {
    jitsumu:  {label:'実務作業', color:'#1565C0', scoreFields:['initiative','responsibility'], showsTarget:false},
    kyouiku:  {label:'教育',     color:'#2E7D32', scoreFields:['education','teamwork'],        showsTarget:true},
    kaizen:   {label:'改善',     color:'#6A1B9A', scoreFields:['initiative','improvement'],     showsTarget:false},
    trouble:  {label:'トラブル', color:'#C62828', scoreFields:['responsibility','improvement'], showsTarget:false},
    followUp: {label:'フォロー', color:'#EF6C00', scoreFields:['teamwork','responsibility'],    showsTarget:true},
    oneOnOne: {label:'1on1',     color:'#00796B', scoreFields:[],                                showsTarget:false}
  };
}
/// 分類の安全な取得(削除済みキーが記録に残っている場合はフォールバック表示)
function catDef(key){
  return (DB.categories && DB.categories[key]) || {label:'(削除された分類)', color:'#9CA3AF', scoreFields:[], showsTarget:false};
}
const SCORE_FIELDS = ['initiative','improvement','teamwork','responsibility','education'];
const SCORE_LABELS = {initiative:'主体性', improvement:'改善力', teamwork:'協調性', responsibility:'責任感', education:'教育力'};
const AVATAR_COLORS = ['#3B5AA6','#00796B','#C2410C','#7C3AED','#0891B2','#BE185D','#4D7C0F','#B45309'];

function uid(){ return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2,8); }
function colorForName(name){
  let h = 0; for(let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name){ return name ? name.slice(0,1) : '?'; }

/* ===================== データ層 (Firestore) ===================== */
// DB はFirestoreのリアルタイム購読結果をキャッシュしたもの。
// 画面描画は常にこのDBを読むだけで、書き込みはFirestoreへ直接行う。
let DB = { members: [], records: [], categories: defaultCategories() };
let authUser = null;
let loading = true;
let unsubscribers = [];
let categorySeedChecked = false;

function startListeners(){
  stopListeners();
  unsubscribers.push(onSnapshot(query(collection(db,'members'), orderBy('order')), snap=>{
    DB.members = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>console.error('members購読エラー', err)));

  unsubscribers.push(onSnapshot(query(collection(db,'records'), orderBy('dateTime','desc')), snap=>{
    DB.records = snap.docs.map(d=>({id:d.id, followUps:[], scores:{}, ...d.data()}));
    render();
  }, err=>console.error('records購読エラー', err)));

  unsubscribers.push(onSnapshot(collection(db,'categories'), async snap=>{
    if(snap.empty){
      if(!categorySeedChecked){
        categorySeedChecked = true;
        await seedDefaultCategories();
      }
      return; // seed後のスナップショット更新を待つ
    }
    const cats = {};
    snap.forEach(d=>{ cats[d.id] = d.data(); });
    DB.categories = cats;
    render();
  }, err=>console.error('categories購読エラー', err)));
}
function stopListeners(){ unsubscribers.forEach(u=>u()); unsubscribers = []; }

async function seedDefaultCategories(){
  const defaults = defaultCategories();
  await Promise.all(Object.entries(defaults).map(([key, val]) => setDoc(doc(db,'categories',key), val)));
}

/* ---- メンバー ---- */
function addMemberDoc(name){ return addDoc(collection(db,'members'), {name, order: DB.members.length}); }
function updateMemberDoc(id, name){ return updateDoc(doc(db,'members',id), {name}); }
function deleteMemberDoc(id){ return deleteDoc(doc(db,'members',id)); }

/* ---- 記録 ---- */
function addRecordDoc(record){ return addDoc(collection(db,'records'), record); }
function updateRecordDoc(id, record){ return setDoc(doc(db,'records',id), record); }
function deleteRecordDoc(id){ return deleteDoc(doc(db,'records',id)); }
function addFollowUpDoc(recordId, followUp){ return updateDoc(doc(db,'records',recordId), { followUps: arrayUnion(followUp) }); }

/* ---- 分類 ---- */
function setCategoryDoc(key, data){ return setDoc(doc(db,'categories',key), data); }
function deleteCategoryDoc(key){ return deleteDoc(doc(db,'categories',key)); }

/* ---- 認証 ---- */
async function login(password){
  try{
    await signInWithEmailAndPassword(auth, FIXED_EMAIL, password);
    return null;
  }catch(e){
    switch(e.code){
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return 'パスワードが違います';
      case 'auth/user-not-found': return 'アカウントが見つかりません(初期設定を確認してください)';
      case 'auth/too-many-requests': return '試行回数が多すぎます。しばらくしてから再度お試しください';
      case 'auth/invalid-api-key':
      case 'auth/api-key-not-valid.-please-pass-a-valid-api-key.': return 'Firebaseの設定(firebaseConfig)が未設定です';
      default: return `ログインに失敗しました(${e.code})`;
    }
  }
}
function logout(){ return signOut(auth); }
async function changePassword(current, next){
  const user = auth.currentUser;
  if(!user) return 'ログインしていません';
  try{
    const cred = EmailAuthProvider.credential(user.email, current);
    await reauthenticateWithCredential(user, cred);
    await updatePassword(user, next);
    return null;
  }catch(e){
    switch(e.code){
      case 'auth/wrong-password':
      case 'auth/invalid-credential': return '現在のパスワードが違います';
      case 'auth/weak-password': return '新しいパスワードが弱すぎます(6文字以上)';
      default: return `パスワード変更に失敗しました(${e.code})`;
    }
  }
}

onAuthStateChanged(auth, user=>{
  authUser = user;
  loading = false;
  if(user){
    startListeners();
    if(route.screen==='login') nav('home'); else render();
  } else {
    stopListeners();
    categorySeedChecked = false;
    nav('login');
  }
});

/* ===================== ルーター/状態 ===================== */

/* ===================== ユーティリティ ===================== */
function fmtDateTime(ts){
  const d = new Date(ts); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function hexToRgba(hex, a){
  const n = parseInt(hex.replace('#',''),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function badge(catKey){
  const c = catDef(catKey);
  return `<span class="badge" style="background:${hexToRgba(c.color,.12)}; color:${c.color}; border:1px solid ${hexToRgba(c.color,.4)};">${c.label}</span>`;
}
function recordSearchText(r){
  const o = r.oneOnOne || {};
  return [r.name, r.target, r.description, r.action, r.result, r.evidence, r.note, o.interviewer, o.content, o.issue, o.nextAction].join(' ').toLowerCase();
}

/* ===================== レンダリング ===================== */
function render(){
  const app = document.getElementById('app');
  Object.values(chartInstances).forEach(c=>{ try{c.destroy();}catch(e){} });
  chartInstances = {};
  let html = '';
  switch(route.screen){
    case 'login': html = screenLogin(); break;
    case 'home': html = screenHome(); break;
    case 'form': html = screenForm(route.params.id||null); break;
    case 'history': html = screenHistory(); break;
    case 'memberHistory': html = screenMemberHistory(route.params.name); break;
    case 'detail': html = screenDetail(route.params.id); break;
    case 'stats': html = screenStats(); break;
    case 'settings': html = screenSettings(); break;
    default: html = screenHome();
  }
  if(route.screen==='login'){
    app.innerHTML = html; // ログイン画面はサイドバーなし
  } else {
    app.innerHTML = `<div class="app-shell">${renderSidebar()}<div class="main-col">${html}</div></div>`;
  }
  afterRender();
}

function renderDynamicFields(catKey, editing){

    const o = editing && editing.oneOnOne ? editing.oneOnOne : {};

      <input type="date" id="f_1on1_date" value="${o.date?new Date(o.date).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}">

    c.scoreFields.forEach(f=>{

      let chips = `<div class="chip-choice score-chip" data-field="${f}" data-val="">未入力</div>`;
      for(let i=0;i<=3;i++) chips += `<div class="chip-choice score-chip ${val===i?'selected':''}" data-field="${f}" data-val="${i}">${i}</div>`;
      scoreHtml += `<div class="score-row" data-score-field="${f}"><div class="slabel">${SCORE_LABELS[f]}</div>${chips}</div>`;
    });
    el.innerHTML = `
      ${c.showsTarget?`<label>対象者</label><input type="text" id="f_target" value="${esc(editing?editing.target:'')}">`:''}
      <label>内容</label><textarea id="f_description">${esc(editing?editing.description:'')}</textarea>
      <label>本人の行動</label><textarea id="f_action">${esc(editing?editing.action:'')}</textarea>
      <label>結果</label><textarea id="f_result">${esc(editing?editing.result:'')}</textarea>
      ${c.scoreFields.length?`<div class="section-title" style="margin-top:0;">評価</div>${scoreHtml}`:''}

    `;

      chip.addEventListener('click', ()=>{
        const field = chip.dataset.field;

        chip.classList.add('selected');
      });
    });
  }
}
function collectScores(){
  const scores = {};
  document.querySelectorAll(`[data-score-field]`).forEach(row=>{
    const field = row.dataset.scoreField;
    const sel = row.querySelector('.score-chip.selected');
    if(sel && sel.dataset.val!=='') scores[field] = parseInt(sel.dataset.val);
  });
  return scores;
}
function saveRecord(existingId){
  const name = document.getElementById('f_name').value;
  const category = document.getElementById('f_category').value;
  const dateVal = document.getElementById('f_date').value;
  const note = document.getElementById('f_note').value.trim();
  if(!name){ alert('氏名を選択してください'); return; }
  const dateTime = new Date(dateVal).getTime();
  const existing = existingId ? DB.records.find(r=>r.id===existingId) : null;
  let record = { dateTime, name, category,
    target:'', description:'', action:'', result:'', scores:{}, evidence:'', note,
    oneOnOne:null, followUps: existing ? (existing.followUps||[]) : [] };
  if(category==='oneOnOne'){
    const dv = document.getElementById('f_1on1_date').value;
    const ndv = document.getElementById('f_1on1_nextDate').value;
    record.oneOnOne = { date: dv? new Date(dv).getTime() : null,
      interviewer: document.getElementById('f_1on1_interviewer').value.trim(),
      content: document.getElementById('f_1on1_content').value.trim(),
      issue: document.getElementById('f_1on1_issue').value.trim(),
      nextAction: document.getElementById('f_1on1_nextAction').value.trim(),
      nextDate: ndv ? new Date(ndv).getTime() : null };
  } else {
    const c = catDef(category);
    record.target = c.showsTarget ? document.getElementById('f_target').value.trim() : '';
    record.description = document.getElementById('f_description').value.trim();
    record.action = document.getElementById('f_action').value.trim();
    record.result = document.getElementById('f_result').value.trim();
    record.scores = collectScores();
    record.evidence = document.getElementById('f_evidence').value.trim();
  }
  const saveBtn = document.getElementById('saveRecordBtn');
  if(saveBtn) saveBtn.disabled = true;
  const promise = existingId ? updateRecordDoc(existingId, record) : addRecordDoc(record);
  promise.then(()=>nav('home')).catch(e=>{ alert('保存に失敗しました: '+e.message); if(saveBtn) saveBtn.disabled = false; });
}

/* ---------- 記録履歴 ---------- */
function groupedByName(records){
  const groups = {};
  records.forEach(r=>{ (groups[r.name] = groups[r.name]||[]).push(r); });
  Object.values(groups).forEach(list=>list.sort((a,b)=>b.dateTime-a.dateTime));
  return Object.entries(groups).sort((a,b)=>b[1][0].dateTime - a[1][0].dateTime);
}
function screenHistory(){
  const tab = uiState.historyTab;
  const splitMode = isDesktop() && tab==='list' && !uiState.selectionMode;
  const bodyHtml = tab==='list'
    ? (splitMode
        ? `<div class="history-split"><div class="list-pane">${historyListTab()}</div><div class="detail-pane">${detailPaneHtml(uiState.selectedDetailId)}</div></div>`
        : historyListTab())
    : historyMemberTab();
  return `
  <div class="appbar">
    <h1>記録履歴</h1>
    <div class="appbar-actions">
      ${tab==='list'?`<button class="icon-btn" id="exportCsvBtn" title="CSV出力">⬇️</button><button class="icon-btn" id="toggleSelection">${uiState.selectionMode?'✕':'☑️'}</button>`:''}
      <span class="icon-btn" id="navBack">✕</span>
    </div>
  </div>
  <div class="tabs">
    <div class="tab ${tab==='list'?'active':''}" data-tab="list">記録一覧</div>
    <div class="tab ${tab==='member'?'active':''}" data-tab="member">メンバー別</div>
  </div>
  <div class="content">${bodyHtml}</div>
  ${uiState.selectionMode?`<button class="fab" id="exportSelectedBtn">📄 PDF出力(${uiState.selectedIds.size})</button>`:''}
  `;
}
function filteredRecordsForList(){
  let list = DB.records.slice();
  if(uiState.filterName) list = list.filter(r=>r.name===uiState.filterName);
  if(uiState.filterCategory) list = list.filter(r=>r.category===uiState.filterCategory);
  if(uiState.searchText.trim()){
    const q = uiState.searchText.trim().toLowerCase();
    list = list.filter(r=>recordSearchText(r).includes(q));
  }
  return list;
}
function historyListTab(){
  const grouped = groupedByName(filteredRecordsForList());
  const nameOpts = DB.members.map(m=>`<option value="${esc(m.name)}" ${uiState.filterName===m.name?'selected':''}>${esc(m.name)}</option>`).join('');
  const catOpts = Object.keys(DB.categories).map(k=>`<option value="${k}" ${uiState.filterCategory===k?'selected':''}>${catDef(k).label}</option>`).join('');
  let body;
  if(!grouped.length){
    body = `<div class="empty-state"><div class="eicon">🔍</div>該当する記録がありません</div>`;
  } else {
    body = grouped.map(([name, list])=>`
      <div class="card name-group hoverable">
        <h4>${esc(name)} <span class="count">${list.length}件</span></h4>
        ${list.map(r=>recordRowHtml(r)).join('')}
      </div>

  }
  return `
    <div class="search-box"><span class="sicon">🔍</span><input type="text" id="searchInput" placeholder="記録を検索(内容・行動・結果・備考など)" value="${esc(uiState.searchText)}"></div>
    <div class="filter-row">
      <select id="filterName"><option value="">すべて(氏名)</option>${nameOpts}</select>
      <select id="filterCategory"><option value="">すべて(分類)</option>${catOpts}</select>

function recordRowHtml(r){
  const desc = r.category==='oneOnOne' ? (r.oneOnOne?r.oneOnOne.content:'') : r.description;
  const followCount = r.followUps.length;
  const checkbox = uiState.selectionMode ? `<input type="checkbox" class="selectBox" data-id="${r.id}" ${uiState.selectedIds.has(r.id)?'checked':''} style="margin-top:4px;">` : '';
  const isActive = uiState.selectedDetailId === r.id;
  return `
    <div class="record-row" data-record-id="${r.id}" style="border-left-color:${catDef(r.category).color}22;${isActive?`background:${hexToRgba(catDef(r.category).color,.07)};border-left-color:${catDef(r.category).color};`:''}">
      ${checkbox}
      <div class="rmain">
        <div class="rtitle">${badge(r.category)}<span class="rdesc">${esc(desc)}</span></div>
        <div class="rdate">${fmtDateTime(r.dateTime)}</div>
      </div>
      ${followCount>0?`<span class="followup-chip">経過あり(${followCount})</span>`:''}
    </div>`;
}
function historyMemberTab(){
  if(!DB.members.length) return `<div class="empty-state"><div class="eicon">👥</div>メンバーが登録されていません</div>`;
  return `<div class="member-grid">
    ${DB.members.map(m=>{
      const cnt = DB.records.filter(r=>r.name===m.name).length;
      return `<div class="member-tile" data-member-name="${esc(m.name)}">
        <div class="member-avatar" style="background:${colorForName(m.name)};">${initials(m.name)}</div>
        <div style="font-weight:700;font-size:13.5px;">${esc(m.name)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:2px;">${cnt}件</div>
      </div>`;
    }).join('')}
  </div>`;

function exportCsv(){
  const list = filteredRecordsForList().sort((a,b)=>b.dateTime-a.dateTime);
  const headers = ['日時','氏名','分類','対象者','内容','本人の行動','結果','主体性','改善力','協調性','責任感','教育力','根拠','備考','実施者','面談内容','課題・気づき','次回アクション','次回予定日'];
  const rows = list.map(r=>{
    const o = r.oneOnOne||{}; const s = r.scores||{};
    return [fmtDateTime(r.dateTime), r.name, catDef(r.category).label, r.target, r.description, r.action, r.result,
      s.initiative??'', s.improvement??'', s.teamwork??'', s.responsibility??'', s.education??'',
      r.evidence, r.note, o.interviewer||'', o.content||'', o.issue||'', o.nextAction||'', o.nextDate?fmtDate(o.nextDate):''];
  });
  const csv = [headers, ...rows].map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `評価記録_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

    </div>
    ${detailBodyHtml(r)}
  </div>`;
}
function detailBodyHtml(r){
  let fields = '';
  if(r.category==='oneOnOne'){
    const o = r.oneOnOne||{};
    fields += fieldHtml('実施日', fmtDate(o.date)); fields += fieldHtml('実施者', o.interviewer);
    fields += fieldHtml('面談内容', o.content); fields += fieldHtml('課題・気づき', o.issue);
    fields += fieldHtml('次回アクション', o.nextAction); fields += fieldHtml('次回予定日', fmtDate(o.nextDate));
  } else {
    if(r.target) fields += fieldHtml('対象者', r.target);
    if(r.description) fields += fieldHtml('内容', r.description);
    if(r.action) fields += fieldHtml('本人の行動', r.action);
    if(r.result) fields += fieldHtml('結果', r.result);
    if(Object.keys(r.scores||{}).length) fields += scoreChartHtml(r.scores);
    if(r.evidence) fields += fieldHtml('根拠', r.evidence);
  }
  if(r.note) fields += fieldHtml('備考', r.note);
  const followHtml = r.followUps.length
    ? r.followUps.map(f=>`<div class="followup-card">${esc(f.content)}<div class="fdate">${fmtDateTime(f.dateTime)}</div></div>`).join('')
    : `<p style="color:var(--sub);font-size:13px;">経過はまだありません</p>`;
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <div class="member-avatar" style="width:34px;height:34px;font-size:13px;background:${colorForName(r.name)};">${initials(r.name)}</div>
      <h2 style="margin:0;font-size:19px;flex:1;">${esc(r.name)}</h2>${badge(r.category)}
    </div>
    <div style="color:var(--sub);font-size:12.5px;margin:6px 0 16px 44px;">${fmtDateTime(r.dateTime)}</div>
    ${fields}
    <div class="section-title">💬 その後の経過</div>
    ${followHtml}
    <button class="btn secondary" id="addFollowUpBtn" data-id="${r.id}" style="margin-top:8px;">＋ 経過を追記</button>
  `;
}
function fieldHtml(label, value){
  if(!value) return '';
  return `<div class="field"><div class="flabel">${label}</div><div class="fvalue">${esc(value)}</div></div>`;
}
function scoreChartHtml(scores){
  const bars = Object.entries(scores).map(([k,v])=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <div style="width:56px;font-size:12px;color:var(--sub);font-weight:700;">${SCORE_LABELS[k]}</div>
      <div style="flex:1;background:#eef0f5;border-radius:6px;height:10px;overflow:hidden;">
        <div style="width:${v/3*100}%;height:100%;background:var(--primary);border-radius:6px;"></div>
      </div>
      <div style="width:16px;font-size:12px;font-weight:700;text-align:right;">${v}</div>
    </div>`).join('');
  return `<div class="field"><div class="flabel">評価</div>${bars}</div>`;
}

function screenStats(){
  const members = DB.members.map(m=>m.name);
  if(!uiState.statsMember && members.length) uiState.statsMember = members[0];
  return `
  <div class="appbar"><span class="back" id="navBack">←</span><h1>統計</h1><div style="width:24px;"></div></div>
  <div class="content">
    <div class="chart-wrap"><h4>📈 月別記録数の推移(直近6ヶ月)</h4>
      <div class="chart-canvas-box"><canvas id="trendChart"></canvas></div></div>

    <div class="chart-wrap"><h4>📊 分類別の件数</h4>
      <div class="chart-canvas-box"><canvas id="catChart"></canvas></div></div>

    <div class="chart-wrap">
      <h4>🕸 メンバー別スコア平均</h4>
      <select id="statsMemberSelect" style="margin-bottom:10px;">
        ${members.map(n=>`<option value="${esc(n)}" ${uiState.statsMember===n?'selected':''}>${esc(n)}</option>`).join('')}
      </select>
      <div class="chart-canvas-box"><canvas id="radarChart"></canvas></div>
    </div>

    <div class="chart-wrap">
      <h4>🏆 記録数ランキング</h4>
      ${rankingTableHtml()}
    </div>
  </div>`;
}
function rankingTableHtml(){
  const counts = DB.members.map(m=>{
    const recs = DB.records.filter(r=>r.name===m.name);
    const allScores = recs.flatMap(r=>Object.values(r.scores||{}));
    const avg = allScores.length ? (allScores.reduce((a,b)=>a+b,0)/allScores.length) : null;
    return {name:m.name, count:recs.length, avg};
  }).sort((a,b)=>b.count-a.count);
  if(!counts.length) return `<p style="color:var(--sub);font-size:13px;">メンバーがいません</p>`;
  return `<table class="rank-table"><thead><tr><th></th><th>氏名</th><th>記録数</th><th>平均スコア</th></tr></thead><tbody>
    ${counts.map((c,i)=>`<tr><td><span class="rank-badge">${i+1}</span></td><td>${esc(c.name)}</td><td>${c.count}件</td><td>${c.avg!==null?c.avg.toFixed(1):'-'}</td></tr>`).join('')}
  </tbody></table>`;
}
function renderStatsCharts(){
  if(!window.Chart) return;
  // 月別推移
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }
  const monthLabels = months.map(d=>`${d.getMonth()+1}月`);
  const monthCounts = months.map(d=>DB.records.filter(r=>{
    const rd = new Date(r.dateTime); return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth();
  }).length);
  const trendCtx = document.getElementById('trendChart');
  if(trendCtx) chartInstances.trend = new Chart(trendCtx, {
    type:'line',
    data:{ labels: monthLabels, datasets:[{ label:'記録数', data: monthCounts, borderColor:'#3B5AA6', backgroundColor:'rgba(59,90,166,.12)', fill:true, tension:.35, pointRadius:4, pointBackgroundColor:'#3B5AA6' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });

  // 分類別
  const catCtx = document.getElementById('catChart');
  const catCounts = Object.keys(DB.categories).map(k=>DB.records.filter(r=>r.category===k).length);
  if(catCtx) chartInstances.cat = new Chart(catCtx, {
    type:'bar',
    data:{ labels: Object.values(DB.categories).map(c=>c.label), datasets:[{ data: catCounts, backgroundColor: Object.values(DB.categories).map(c=>c.color), borderRadius:6 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } } }
  });

  renderRadar();
}
function renderRadar(){
  const radarCtx = document.getElementById('radarChart');
  if(!radarCtx) return;
  if(chartInstances.radar) chartInstances.radar.destroy();
  const name = uiState.statsMember;
  const recs = DB.records.filter(r=>r.name===name);
  const data = SCORE_FIELDS.map(f=>{
    const vals = recs.map(r=>r.scores && r.scores[f]).filter(v=>v!==undefined && v!==null);
    return vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  });
  chartInstances.radar = new Chart(radarCtx, {
    type:'radar',
    data:{ labels: SCORE_FIELDS.map(f=>SCORE_LABELS[f]), datasets:[{ label:name, data, backgroundColor:'rgba(59,90,166,.2)', borderColor:'#3B5AA6', pointBackgroundColor:'#3B5AA6' }] },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ r:{ min:0, max:3, ticks:{ stepSize:1 } } }, plugins:{legend:{display:false}} }
  });
}

/* ===================== モーダル ===================== */
function showModal(html){
  const overlay = document.createElement('div'); overlay.className = 'modal-overlay'; overlay.id = 'modalOverlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`; document.body.appendChild(overlay);
}
function closeModal(){ const overlay = document.getElementById('modalOverlay'); if(overlay) overlay.remove(); }
function promptModal(title, placeholder, initial, onSubmit){
  showModal(`<h3>${title}</h3><input type="text" id="modalInput" value="${esc(initial||'')}" placeholder="${placeholder||''}" autofocus>
    <div class="modal-actions"><button class="btn secondary" id="modalCancel">キャンセル</button><button class="btn" id="modalOk">OK</button></div>`);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = ()=>{ const val = document.getElementById('modalInput').value.trim(); closeModal(); if(val) onSubmit(val); };
}
function confirmModal(title, body, onConfirm){
  showModal(`<h3>${title}</h3><p style="font-size:13px;color:var(--sub);">${body||''}</p>
    <div class="modal-actions"><button class="btn secondary" id="modalCancel">キャンセル</button><button class="btn danger" id="modalOk">実行</button></div>`);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = ()=>{ closeModal(); onConfirm(); };
}
function followUpModal(recordId){
  showModal(`<h3>経過を追記</h3><textarea id="modalTextarea" placeholder="内容を入力" autofocus></textarea>
    <div class="modal-actions"><button class="btn secondary" id="modalCancel">キャンセル</button><button class="btn" id="modalOk">追加</button></div>`);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = ()=>{
    const val = document.getElementById('modalTextarea').value.trim(); if(!val){ closeModal(); return; }
    addFollowUpDoc(recordId, {id:uid(), dateTime:Date.now(), content:val})
      .then(()=>{ closeModal(); render(); })
      .catch(e=>alert('追記に失敗しました: '+e.message));
  };
}
function changePasswordModal(){
  showModal(`<h3>パスワード変更</h3><label>現在のパスワード</label><input type="password" id="curPass">
    <label>新しいパスワード</label><input type="password" id="newPass">
    <div id="pwError" class="error-text" style="display:none;"></div>
    <div class="modal-actions"><button class="btn secondary" id="modalCancel">キャンセル</button><button class="btn" id="modalOk">変更</button></div>`);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = async ()=>{
    const current = document.getElementById('curPass').value;
    const next = document.getElementById('newPass').value;
    const err = document.getElementById('pwError');
    if(next.length<6){ err.textContent = '新しいパスワードは6文字以上にしてください'; err.style.display='block'; return; }
    const okBtn = document.getElementById('modalOk'); okBtn.disabled = true;
    const error = await changePassword(current, next);
    if(error){ err.textContent = error; err.style.display='block'; okBtn.disabled = false; return; }
    closeModal();
  };
}

function categoryModal(existingKey){
  const existing = existingKey ? DB.categories[existingKey] : null;
  const label = existing ? existing.label : '';
  const color = existing ? existing.color : '#3B5AA6';
  const showsTarget = existing ? existing.showsTarget : false;
  const scoreFields = existing ? (existing.scoreFields||[]) : [];
  const isOneOnOne = existingKey === 'oneOnOne';
  showModal(`
    <h3>${existingKey?'分類を編集':'分類を追加'}</h3>
    <label>分類名</label>
    <input type="text" id="catLabel" value="${esc(label)}" placeholder="例: 安全">
    <label>バッジ色</label>
    <input type="color" id="catColor" value="${color}" style="height:44px;padding:4px;margin-bottom:14px;">
    ${isOneOnOne ? `<p style="font-size:11.5px;color:var(--sub);margin-top:-6px;">※1on1は専用フォーム(実施日・実施者・面談内容など)が使われるため、対象者欄・評価項目の設定はありません。</p>` : `
    <label style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="catShowsTarget" ${showsTarget?'checked':''} style="width:auto;margin:0;">対象者欄を表示する
    </label>
    <label style="margin-top:14px;">評価スコア項目(記録フォームに表示する項目)</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      ${SCORE_FIELDS.map(f=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:400;border:1px solid var(--border);padding:6px 10px;border-radius:8px;">
        <input type="checkbox" class="catScoreField" value="${f}" ${scoreFields.includes(f)?'checked':''} style="width:auto;margin:0;">${SCORE_LABELS[f]}
      </label>`).join('')}
    </div>`}
    <div id="catError" class="error-text" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn secondary" id="modalCancel">キャンセル</button>
      <button class="btn" id="modalOk">保存</button>
    </div>
  `);
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalOk').onclick = ()=>{
    const newLabel = document.getElementById('catLabel').value.trim();
    if(!newLabel){
      const err = document.getElementById('catError');
      err.textContent = '分類名を入力してください'; err.style.display = 'block';
      return;
    }
    const newColor = document.getElementById('catColor').value;
    const newShowsTarget = isOneOnOne ? false : document.getElementById('catShowsTarget').checked;
    const newScoreFields = isOneOnOne ? [] : Array.from(document.querySelectorAll('.catScoreField:checked')).map(cb=>cb.value);
    const key = existingKey || ('cat_' + uid());
    setCategoryDoc(key, { label:newLabel, color:newColor, showsTarget:newShowsTarget, scoreFields:newScoreFields })
      .then(closeModal)
      .catch(e=>{
        const err = document.getElementById('catError');
        err.textContent = '保存に失敗しました: '+e.message; err.style.display = 'block';
      });
  };
}
function deleteCategory(key){
  if(Object.keys(DB.categories).length <= 1){
    alert('分類は最低1つ必要です');
    return;
  }
  const inUseCount = DB.records.filter(r=>r.category===key).length;
  confirmModal(
    `「${catDef(key).label}」を削除しますか?`,
    inUseCount>0 ? `この分類を使っている記録が${inUseCount}件あります。記録自体は削除されませんが、分類表示は「(削除された分類)」になります。` : '',
    ()=>{ deleteCategoryDoc(key).catch(e=>alert('削除に失敗しました: '+e.message)); }
  );
}

/* ===================== PDF出力(印刷) ===================== */
function printRecords(title, records){
  const w = window.open('', '_blank');
  const style = `<style>
      body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;padding:24px;color:#222;}
      h1{font-size:18px;margin-bottom:2px;} .meta{font-size:11px;color:#666;margin-bottom:16px;}
      .card{border:1px solid #ccc;border-radius:6px;padding:12px;margin-bottom:12px;page-break-inside:avoid;}
      .rowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
      .badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff;}
      .field{margin-bottom:6px;font-size:12px;} .field b{display:inline-block;width:90px;}
      .followups{margin-top:6px;font-size:11px;color:#333;}</style>`;
  let body = `<h1>${esc(title)}</h1><div class="meta">出力日: ${fmtDateTime(Date.now())}</div>`;
  records.forEach(r=>{
    const c = catDef(r.category);
    body += `<div class="card"><div class="rowtop"><b>${esc(r.name)}</b><span><span class="badge" style="background:${c.color}">${c.label}</span> <span style="font-size:11px;color:#666;">${fmtDateTime(r.dateTime)}</span></span></div>`;
    if(r.category==='oneOnOne'){
      const o = r.oneOnOne||{};
      body += fieldLine('実施日', fmtDate(o.date)) + fieldLine('実施者', o.interviewer) + fieldLine('面談内容', o.content) + fieldLine('課題・気づき', o.issue) + fieldLine('次回アクション', o.nextAction) + fieldLine('次回予定日', fmtDate(o.nextDate));
    } else {
      const scoreStr = Object.entries(r.scores||{}).map(([k,v])=>`${SCORE_LABELS[k]}:${v}`).join(' / ');
      body += fieldLine('対象者', r.target) + fieldLine('内容', r.description) + fieldLine('本人の行動', r.action) + fieldLine('結果', r.result) + fieldLine('評価', scoreStr) + fieldLine('根拠', r.evidence);
    }
    body += fieldLine('備考', r.note);
    if(r.followUps.length) body += `<div class="followups"><b>経過(${r.followUps.length}件)</b><br>` + r.followUps.map(f=>`・${fmtDateTime(f.dateTime)} ${esc(f.content)}`).join('<br>') + `</div>`;
    body += `</div>`;
  });
  w.document.write(`<html><head><title>${esc(title)}</title>${style}</head><body>${body}</body></html>`);
  w.document.close(); setTimeout(()=>w.print(), 300);
}
function fieldLine(label, value){ if(!value) return ''; return `<div class="field"><b>${label}</b>${esc(value)}</div>`; }

/* ===================== イベントバインド ===================== */
function afterRender(){
  const $ = sel => document.getElementById(sel);
  if($('navBack')) $('navBack').onclick = ()=>nav(historyBackTarget());

  document.querySelectorAll('.sidebar .nav-item[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const target = el.dataset.nav;
      if(target==='logout'){
        confirmModal('ログアウトしますか?','', ()=>{ logout(); });
      } else {
        uiState.selectedDetailId = null;
        nav(target);
      }
    };
  });

  switch(route.screen){
    case 'login':
      if($('loginBtn')){
        $('loginBtn').onclick = async ()=>{
          const pwField = $('loginPassword');
          const errEl = $('loginError');
          if(!pwField.value){ errEl.textContent = 'パスワードを入力してください'; errEl.style.display='block'; return; }
          const btn = $('loginBtn'); btn.disabled = true;
          const error = await login(pwField.value);
          if(error){ errEl.textContent = error; errEl.style.display='block'; btn.disabled = false; }
          // 成功時はonAuthStateChangedがnav('home')する
        };
        $('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') $('loginBtn').click(); });
      }
      break;

    case 'home':
      $('goSettings').onclick = ()=>nav('settings');
      $('goSettings2').onclick = ()=>nav('settings');
      $('goForm').onclick = ()=>nav('form');
      $('goHistory').onclick = ()=>nav('history');
      $('goStats').onclick = ()=>nav('stats');
      document.querySelectorAll('.record-row[data-record-id]').forEach(row=>{
        row.onclick = ()=>nav('detail', {id: row.dataset.recordId});
      });
      renderHomeDonut();
      break;

    case 'form': {
      const editing = route.params.id ? DB.records.find(r=>r.id===route.params.id) : null;
      renderDynamicFields($('f_category').value, editing);
      $('f_category').onchange = ()=>renderDynamicFields($('f_category').value, editing);
      $('saveRecordBtn').onclick = ()=>saveRecord(route.params.id||null);
      break;
    }

    case 'history': {
      document.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ uiState.historyTab = t.dataset.tab; render(); }; });
      if($('toggleSelection')) $('toggleSelection').onclick = ()=>{ uiState.selectionMode = !uiState.selectionMode; uiState.selectedIds = new Set(); render(); };
      if($('exportCsvBtn')) $('exportCsvBtn').onclick = exportCsv;
      const si = $('searchInput'); if(si) si.oninput = ()=>{ uiState.searchText = si.value; render(); setTimeout(()=>{ const el = document.getElementById('searchInput'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },0); };
      const fn = $('filterName'); if(fn) fn.onchange = ()=>{ uiState.filterName = fn.value; render(); };
      const fc = $('filterCategory'); if(fc) fc.onchange = ()=>{ uiState.filterCategory = fc.value; render(); };
      document.querySelectorAll('.selectBox').forEach(cb=>{
        cb.onclick = (e)=>{ e.stopPropagation(); };
        cb.onchange = ()=>{ if(cb.checked) uiState.selectedIds.add(cb.dataset.id); else uiState.selectedIds.delete(cb.dataset.id); render(); };
      });
      document.querySelectorAll('.record-row[data-record-id]').forEach(row=>{
        row.onclick = ()=>{
          if(uiState.selectionMode){
            const id = row.dataset.recordId;
            if(uiState.selectedIds.has(id)) uiState.selectedIds.delete(id); else uiState.selectedIds.add(id);
            render();
          } else if(isDesktop()){
            uiState.selectedDetailId = row.dataset.recordId;
            render();
          } else {
            nav('detail', {id: row.dataset.recordId});
          }
        };
      });
      document.querySelectorAll('.member-tile').forEach(tile=>{ tile.onclick = ()=>nav('memberHistory', {name: tile.dataset.memberName}); });
      if($('exportSelectedBtn')) $('exportSelectedBtn').onclick = ()=>{
        const recs = DB.records.filter(r=>uiState.selectedIds.has(r.id)).sort((a,b)=>b.dateTime-a.dateTime);
        if(recs.length) printRecords('評価記録(一括)', recs);
      };
      break;
    }

    case 'memberHistory': {
      $('toggleSort').onclick = ()=>{ uiState.sortNewestFirst = !uiState.sortNewestFirst; render(); };
      $('exportPersonBtn').onclick = ()=>{
        const list = DB.records.filter(r=>r.name===route.params.name).sort((a,b)=>b.dateTime-a.dateTime);
        printRecords(`${route.params.name} さんの評価記録`, list);
      };
      document.querySelectorAll('.record-row[data-record-id]').forEach(row=>{ row.onclick = ()=>nav('detail', {id: row.dataset.recordId}); });
      break;
    }

    case 'detail':
      // ボタンのバインドは共通処理(bindDetailActions)で行う
      break;

    case 'stats': {
      renderStatsCharts();
      const sel = $('statsMemberSelect');
      if(sel) sel.onchange = ()=>{ uiState.statsMember = sel.value; renderRadar(); };
      break;
    }

    case 'settings': {
      $('addMemberBtn').onclick = ()=>promptModal('メンバーを追加','氏名','', name=>{
        addMemberDoc(name).catch(e=>alert('追加に失敗しました: '+e.message));
      });
      document.querySelectorAll('[data-edit-member]').forEach(btn=>{
        btn.onclick = ()=>{ const m = DB.members.find(x=>x.id===btn.dataset.editMember);
          promptModal('メンバー名を編集','氏名', m.name, name=>{
            updateMemberDoc(m.id, name).catch(e=>alert('更新に失敗しました: '+e.message));
          }); };
      });
      document.querySelectorAll('[data-delete-member]').forEach(btn=>{
        btn.onclick = ()=>{ const m = DB.members.find(x=>x.id===btn.dataset.deleteMember);
          confirmModal(`${m.name}を削除しますか?`, '過去の記録は削除されません。', ()=>{
            deleteMemberDoc(m.id).catch(e=>alert('削除に失敗しました: '+e.message));
          }); };
      });
      $('addCategoryBtn').onclick = ()=>categoryModal(null);
      document.querySelectorAll('[data-edit-category]').forEach(btn=>{
        btn.onclick = ()=>categoryModal(btn.dataset.editCategory);
      });
      document.querySelectorAll('[data-delete-category]').forEach(btn=>{
        btn.onclick = ()=>deleteCategory(btn.dataset.deleteCategory);
      });
      $('changePasswordRow').onclick = changePasswordModal;
      $('logoutRow').onclick = ()=>confirmModal('ログアウトしますか?','', ()=>{ logout(); });
      break;
    }
  }
  bindDetailActions();
}
function bindDetailActions(){
  const editBtn = document.getElementById('editRecordBtn');
  if(editBtn) editBtn.onclick = ()=>nav('form', {id: editBtn.dataset.id});
  const exportBtn = document.getElementById('exportSingleBtn');
  if(exportBtn) exportBtn.onclick = ()=>{ const r = DB.records.find(x=>x.id===exportBtn.dataset.id); printRecords('評価記録', [r]); };
  const followBtn = document.getElementById('addFollowUpBtn');
  if(followBtn) followBtn.onclick = ()=>followUpModal(followBtn.dataset.id);
}
function historyBackTarget(){
  if(route.screen==='form') return 'home';
  if(route.screen==='history') return 'home';
  if(route.screen==='memberHistory') return 'history';
  if(route.screen==='detail') return 'history';
  if(route.screen==='stats') return 'home';
  if(route.screen==='settings') return 'home';
  return 'home';
}

render();
</script>
</body>
</html>
